[package]
name = "simplebackup"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
color-eyre = "0.6.5"
humantime = "2.4.0"
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = { version = "0.21.4", features = ["compress", "deflate", "ppmd", "util"], default-features = false }
thiserror = "2.0.20"
trash = "5.2.6"
walkdir = "2.5.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = true
